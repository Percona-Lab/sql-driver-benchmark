# Stack inventory. `tuned` lists candidate driver/framework options; each is
# verified against the installed version during the build and the final set is
# recorded in every result file. Wrappers name the driver they run on (`on`).
# `paths` for ORMs: core = raw/query-builder path, orm = entity materialization.

tier1:  # native drivers
  c:
    libmysqlclient:   {tuned: [mysql_use_result for streaming, prepared stmt API for binary]}
    mariadb-connc:    {tuned: [mysql_use_result, STMT_ATTR_ARRAY_SIZE bulk insert, MARIADB_OPT_* metadata cache]}
  cpp:
    mysql-connector-cpp-jdbc:   {tuned: [prepared statements, fetch streaming]}
    mysql-connector-cpp-xdevapi: {servers: [ps], note: "X Protocol; MariaDB has no X plugin"}
    mariadb-connector-cpp:      {tuned: [useServerPrepStmts, rewriteBatchedStatements, fetchSize]}
  java:
    mysql-connector-j: {tuned: [useServerPrepStmts, cachePrepStmts, prepStmtCacheSize, rewriteBatchedStatements, cacheResultSetMetadata, cacheServerConfiguration, useLocalSessionState, elideSetAutoCommits, "fetchSize=Integer.MIN_VALUE streaming"]}
    mariadb-connector-j: {tuned: [useServerPrepStmts, cachePrepStmts, useBulkStmts, fetchSize streaming]}
  python:
    mysqlclient:               {tuned: [SSCursor streaming, executemany multi-row]}
    mysql-connector-python-c:  {tuned: [prepared cursor, raw, buffered off]}
    mysql-connector-python-pure: {tuned: [use_pure=True + same as above]}
    pymysql:                   {tuned: [SSCursor, executemany]}
    mariadb-connector-python:  {tuned: [binary=True, executemany bulk, buffered off]}
  go:
    go-sql-driver-mysql: {tuned: [interpolateParams, explicit Prepare, columnsWithAlias off]}
    go-mysql-client:     {tuned: [ExecuteSelectStreaming, prepared]}
  node:
    mysql2:   {tuned: [rowsAsArray, execute() prepared, query stream]}
    mariadb:  {tuned: [rowsAsArray, prepareCacheLength, batch() bulk, queryStream]}
    mysql:    {note: legacy, still widely installed; tuned: [stream]}
  php:
    mysqli:    {tuned: [MYSQLI_USE_RESULT, MYSQLI_OPT_INT_AND_FLOAT_NATIVE, prepared]}
    pdo-mysql: {tuned: [ATTR_EMULATE_PREPARES=false, MYSQL_ATTR_USE_BUFFERED_QUERY=false, FETCH_NUM]}
  ruby:
    mysql2:  {tuned: ["stream: true, cache_rows: false", "as: :array", prepared]}
    trilogy: {tuned: []}
  rust:
    mysql:        {tuned: [prepared stmt cache, query_iter streaming]}
    sqlx-mysql:   {tuned: [statement cache, fetch stream]}
  dotnet:
    mysqlconnector: {tuned: ["Pooling=false (all configs)", Prepare(), IgnorePrepare=false]}
    mysql-data:     {tuned: ["Pooling=false (all configs)", Prepare()]}

tier2:  # wrappers / frameworks
  python:
    sqlalchemy-core: {on: mysqlclient, also_on: [pymysql, mariadb-connector-python], tuned: [NullPool, stream_results/yield_per, insertmanyvalues, compiled cache]}
    sqlalchemy-orm:  {on: mysqlclient, paths: [core, orm], tuned: [yield_per, bulk insert via insert().values, expire_on_commit=False]}
    django-orm:      {on: mysqlclient, paths: [core, orm], tuned: [values_list, iterator(chunk_size), bulk_create(batch_size=1000)]}
  java:
    hibernate:       {on: mysql-connector-j, also_on: [mariadb-connector-j], paths: [core, orm], tuned: [jdbc.batch_size=1000, order_inserts, StatelessSession, read-only, fetch_size]}
    jooq:            {on: mysql-connector-j, tuned: [fetchLazy, batch/bulk insert, no-record-attach]}
    spring-jdbctemplate: {on: mysql-connector-j, tuned: [batchUpdate, RowCallbackHandler]}
  go:
    sqlx: {on: go-sql-driver-mysql}
    gorm: {on: go-sql-driver-mysql, paths: [core, orm], tuned: [PrepareStmt, SkipDefaultTransaction, CreateInBatches(1000), Rows() streaming]}
  node:
    knex:      {on: mysql2}
    sequelize: {on: mysql2, also_on: [mariadb], paths: [core, orm], tuned: ["raw: true", bulkCreate]}
    typeorm:   {on: mysql2, paths: [core, orm], tuned: [query builder getRawMany, insert().values bulk]}
    drizzle:   {on: mysql2}
    prisma:    {on: "mariadb (driver adapter)", paths: [core, orm], tuned: [createMany, queryRaw]}
  php:
    doctrine-dbal: {on: pdo-mysql}
    doctrine-orm:  {on: pdo-mysql, paths: [core, orm], tuned: [toIterable, HYDRATE_ARRAY, batch flush/clear]}
    eloquent:      {on: pdo-mysql, paths: [core, orm], tuned: [toBase, lazy/cursor, insert chunks]}
  ruby:
    activerecord: {on: mysql2, also_on: [trilogy], paths: [core, orm], tuned: [pluck, insert_all, find_each]}
    sequel:       {on: mysql2, tuned: [naked, multi_insert, paged_each]}
  dotnet:
    dapper:  {on: mysqlconnector, tuned: ["buffered: false"]}
    efcore:  {on: "mysqlconnector (Pomelo)", paths: [core, orm], tuned: [AsNoTracking, compiled queries, AddRange + MaxBatchSize]}
  rust:
    diesel:  {on: "mysqlclient-sys (libmysqlclient)", paths: [core, orm]}
    seaorm:  {on: sqlx-mysql, paths: [core, orm]}

tier3:
  async:
    python: [aiomysql, asyncmy]
    java:   [r2dbc-mysql (asyncer), r2dbc-mariadb]
    rust:   [mysql_async]
  odbc:     [mysql-connector-odbc, mariadb-connector-odbc]   # driven from a C runner via unixODBC
  perl:     [DBD-mysql, DBD-MariaDB]
  xprotocol:
    node:   ["@mysql/xdevapi"]   # ps only
    python: [mysqlx (mysql-connector-python)]   # ps only
