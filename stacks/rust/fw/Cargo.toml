[package]
name = "fwrunner"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# Separate crate from the driver runner: SeaORM brings its own sqlx version.
[dependencies]
diesel = { version = "=2.4.0", default-features = false, features = ["mysql", "chrono", "numeric", "128-column-tables"] }
sea-orm = { version = "=2.0.4", default-features = false, features = ["macros", "sqlx-mysql", "runtime-tokio-rustls", "with-chrono", "with-rust_decimal", "stream"] }
bigdecimal = "0.4"
# libmysqlclient 9.7 is newer than the bundled bindings (<= 9.5): generate them from the installed headers
mysqlclient-sys = { version = "=0.5.3", features = ["buildtime_bindgen"] }
tokio = { version = "1", features = ["rt", "macros"] }
futures-util = "0.3"
chrono = "0.4"
serde_json = "1"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }

[profile.release]
debug = 1            # symbols for the profiling pass
