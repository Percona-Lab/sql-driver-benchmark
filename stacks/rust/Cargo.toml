[package]
name = "runner"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
mysql = { version = "28", default-features = false, features = ["minimal", "rustls-tls"] }   # TLS is opt-in in mysql 28
sqlx = { version = "0.9", default-features = false, features = ["mysql", "runtime-tokio", "tls-rustls", "rust_decimal", "chrono"] }
tokio = { version = "1", features = ["rt", "macros"] }
futures-util = "0.3"
rust_decimal = "1"
chrono = "0.4"
serde_json = "1"
libc = "0.2"

[profile.release]
debug = 1            # symbols for the profiling pass
